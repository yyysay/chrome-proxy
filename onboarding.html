<!doctype html>
<html lang="zh-CN">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><link rel="icon" href="/icons/icon-32.png" /><title>欢迎使用 Auto Proxy</title></head>
  <body class="onboarding-page min-h-screen bg-stone-100 font-sans text-sm text-stone-900 antialiased dark:bg-black dark:text-[#f5f5f7]">
    <main class="flex min-h-screen items-center justify-center px-4 py-6">
      <section class="w-full max-w-[720px] overflow-hidden rounded-2xl border border-stone-200 bg-white shadow-xl dark:border-white/15 dark:bg-[#1c1c1e]">
        <header class="flex items-center justify-between gap-4 border-b border-stone-100 px-6 py-5 dark:border-white/10"><div class="flex items-center gap-3"><img src="/icons/icon-48.png" alt="Auto Proxy" class="size-10 rounded-xl" /><span><h1 class="text-2xl font-black">导入远程 YAML</h1><p class="mt-1 text-stone-500 dark:text-white/60">一个订阅地址即可完成配置</p></span></div><button id="open-settings" class="rounded-xl border border-stone-200 px-4 py-2.5 font-bold dark:border-white/15" type="button">高级设置</button></header>
        <div class="p-6">
          <form id="onboarding-remote-form"><label class="block"><span class="mb-2 block font-bold">远程 YAML 订阅</span><input id="onboarding-config-url" class="w-full rounded-xl border border-stone-300 bg-stone-50 px-4 py-3 outline-none dark:border-white/15 dark:bg-[#161618]" type="url" placeholder="https://example.com/config.yaml" required /></label><button id="apply-remote-and-enable" class="mt-4 w-full rounded-xl bg-stone-900 px-5 py-3 font-extrabold text-white disabled:opacity-50 dark:bg-[#0a84ff]" type="submit">同步、应用并开启</button></form>
          <details class="mt-5 rounded-xl border border-stone-200 dark:border-white/10"><summary class="cursor-pointer px-4 py-3 font-bold text-stone-500 dark:text-white/60">或手动粘贴 YAML</summary><form id="onboarding-manual-form" class="border-t border-stone-200 p-4 dark:border-white/10"><textarea id="onboarding-config" class="min-h-[300px] w-full rounded-xl border border-stone-300 bg-stone-50 p-4 font-mono text-[13px] leading-5 outline-none dark:border-white/15 dark:bg-[#161618]" spellcheck="false" aria-label="手动 YAML 配置"></textarea><button id="apply-manual-and-enable" class="mt-3 w-full rounded-xl border border-stone-300 px-5 py-3 font-extrabold dark:border-white/15" type="submit">应用手动配置并开启</button></form></details>
          <p id="onboarding-hint" class="mt-3 text-sm text-stone-500 dark:text-white/60">支持多个 HTTP 节点、yaml/list 远程规则包与本地规则。</p>
          <div class="mt-5 flex justify-end"><button id="close-page" class="rounded-xl px-4 py-2.5 font-bold text-stone-500 dark:text-white/60" type="button">稍后配置</button></div>
        </div>
      </section>
    </main>
    <script type="module" src="/src/onboarding/onboarding.ts"></script>
  </body>
</html>
