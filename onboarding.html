<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>欢迎使用 Auto Proxy</title>
  </head>
  <body>
    <main class="welcome-page">
      <section class="welcome-card">
        <div class="brand-mark" aria-hidden="true">A</div>
        <p class="eyebrow">AUTO PROXY</p>
        <h1>安装完成</h1>
        <p class="lead">点击开启 Auto Proxy 即可使用默认代理与默认规则。完成后可以关闭本页面，以后日常只需要扩展图标里的一个开关。</p>

        <ol class="steps" aria-label="开始使用">
          <li><span>1</span><div><strong>点击开启</strong><small>Auto Proxy 会自动使用默认代理配置和默认分流规则。</small></div></li>
          <li><span>2</span><div><strong>关闭本页面</strong><small>开启成功后，这个引导页面以后不需要再访问。</small></div></li>
          <li><span>3</span><div><strong>日常只用一个开关</strong><small>以后在浏览器工具栏里开启或关闭 Auto Proxy 即可。</small></div></li>
        </ol>

        <section class="current-state" aria-live="polite">
          <span id="status-dot" class="status-dot" aria-hidden="true"></span>
          <div>
            <strong id="onboarding-status">正在读取状态…</strong>
            <small id="onboarding-detail">请稍候</small>
          </div>
        </section>

        <button id="enable-proxy" class="primary-action" type="button" disabled>开启 Auto Proxy</button>
        <button id="close-page" class="secondary-action" type="button" hidden>关闭此页面</button>
        <button id="open-settings" class="text-action" type="button">高级设置</button>

        <p class="footnote">高级设置仅用于修改代理订阅、手动覆盖、未命中策略和自定义规则。</p>
      </section>
    </main>
    <script type="module" src="/src/onboarding/onboarding.ts"></script>
  </body>
</html>
