<!doctype html>
<html lang="zh-CN">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><link rel="icon" href="/icons/icon-32.png" /><title>欢迎使用 Auto Proxy</title></head>
  <body class="onboarding-page min-h-screen bg-[#f5f5f7] font-sans text-sm text-[#1d1d1f] antialiased dark:bg-black dark:text-[#f5f5f7]">
    <main class="flex min-h-screen items-center justify-center px-4 py-6">
      <section class="w-full max-w-[760px] overflow-hidden rounded-[28px] border border-black/[.07] bg-white shadow-[0_12px_40px_rgba(0,0,0,.08)] dark:border-white/10 dark:bg-[#1c1c1e]">
        <header class="flex items-center justify-between gap-4 px-7 py-5"><div class="flex items-center gap-3"><img src="/icons/icon-48.png" alt="Auto Proxy" class="size-11 rounded-xl" /><span><h1 class="text-2xl font-semibold tracking-[-.035em]">配置 Auto Proxy</h1><p class="mt-1 text-stone-500 dark:text-white/60">输入一条 YAML 订阅链接即可开始</p></span></div><button id="open-settings" class="rounded-full bg-black/[.04] px-4 py-2.5 text-xs font-medium text-stone-500 transition hover:bg-black/[.07] dark:bg-white/8 dark:text-white/55" type="button">高级设置</button></header>
        <div id="onboarding-setup" class="p-7">
          <ol class="mb-7 grid grid-cols-3 gap-2 rounded-full bg-black/[.035] p-1 dark:bg-white/[.06]" aria-label="配置步骤"><li class="rounded-full bg-white px-4 py-2.5 text-center text-stone-800 shadow-sm dark:bg-white/12 dark:text-white"><small class="mr-1.5 text-stone-400">1</small><strong class="font-medium">输入订阅</strong></li><li class="rounded-full px-4 py-2.5 text-center text-stone-400 dark:text-white/35"><small class="mr-1.5">2</small><strong class="font-medium">自动检测</strong></li><li class="rounded-full px-4 py-2.5 text-center text-stone-400 dark:text-white/35"><small class="mr-1.5">3</small><strong class="font-medium">自动开启</strong></li></ol>
          <form id="onboarding-remote-form"><label class="block"><span class="mb-2 block text-sm font-semibold">远程 YAML 订阅地址</span><input id="onboarding-config-url" class="w-full rounded-full border-0 bg-black/[.04] px-5 py-4 text-[15px] outline-none ring-[#007aff]/20 transition focus:ring-2 dark:bg-white/[.07]" type="url" placeholder="https://example.com/config.yaml" autofocus required /></label><p class="mt-2 px-2 text-xs text-stone-400 dark:text-white/40">配置检测通过后会自动同步规则并开启代理。</p><button id="apply-remote-and-enable" class="mt-5 w-full rounded-full bg-[#007aff] px-5 py-3.5 text-[15px] font-semibold text-white transition hover:bg-[#006ee6] disabled:opacity-50 dark:bg-[#0a84ff]" type="submit">检测配置并开始</button></form>
          <div id="onboarding-progress" class="mt-4 rounded-[18px] bg-black/[.035] px-4 py-3 dark:bg-white/[.06]" hidden><strong id="onboarding-progress-title" class="block font-semibold">正在检测配置</strong><p id="onboarding-hint" class="mt-1 text-sm text-stone-500 dark:text-white/60">正在下载远程 YAML…</p></div>
          <details class="mt-5 overflow-hidden rounded-[18px] border border-black/[.07] dark:border-white/10"><summary class="cursor-pointer px-4 py-3 font-medium text-stone-500 dark:text-white/60">没有订阅链接？手动粘贴 YAML</summary><form id="onboarding-manual-form" class="border-t border-black/[.055] p-4 dark:border-white/10"><textarea id="onboarding-config" class="min-h-[260px] w-full rounded-[16px] border-0 bg-black/[.035] p-4 font-mono text-[13px] leading-5 outline-none ring-[#007aff]/20 focus:ring-2 dark:bg-black/30" spellcheck="false" aria-label="手动 YAML 配置"></textarea><button id="apply-manual-and-enable" class="mt-3 w-full rounded-full bg-black/[.04] px-5 py-3 font-medium transition hover:bg-black/[.07] dark:bg-white/8" type="submit">检测并应用手动配置</button></form></details>
          <div class="mt-5 flex justify-end"><button id="skip-page" class="rounded-full px-4 py-2.5 font-medium text-stone-400 hover:bg-black/[.035] dark:text-white/40" type="button">稍后配置</button></div>
        </div>
        <section id="onboarding-success" class="p-8 text-center" hidden>
          <img src="/icons/icon-active-128.png" alt="Auto Proxy 已开启" class="mx-auto size-20 rounded-3xl" />
          <h2 class="mt-5 text-2xl font-semibold tracking-[-.03em]">配置完成，代理已自动开启</h2>
          <p class="mx-auto mt-2 max-w-lg text-stone-500 dark:text-white/60">以后远程 YAML 和规则包都会自动更新。</p>
          <div class="mx-auto mt-6 max-w-lg rounded-2xl border border-amber-200 bg-amber-50 px-5 py-4 text-left dark:border-[#ff9f0a]/30 dark:bg-[#ff9f0a]/10"><strong class="text-amber-800 dark:text-[#ff9f0a]">建议固定到工具栏</strong><p class="mt-1 text-sm text-amber-700/80 dark:text-[#ffb340]">点击 Chrome 右上角的扩展程序按钮，找到 Auto Proxy，再点击图钉。这样可以随时查看当前网站是代理还是直连。</p></div>
          <button id="close-page" class="mt-7 rounded-full bg-[#007aff] px-8 py-3 font-semibold text-white dark:bg-[#0a84ff]" type="button">关闭引导页</button>
        </section>
      </section>
    </main>
    <script type="module" src="/src/onboarding/onboarding.ts"></script>
  </body>
</html>
