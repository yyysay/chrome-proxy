<!doctype html>
<html lang="zh-CN">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><link rel="icon" href="/icons/icon-32.png" /><title>Auto Proxy 高级设置</title></head>
  <body class="settings-page min-h-screen bg-stone-100 font-sans text-sm leading-5 text-stone-900 antialiased dark:bg-black dark:text-[#f5f5f7] dark:[color-scheme:dark]">
    <main class="mx-auto flex h-screen w-full max-w-[1120px] items-center justify-center px-3 py-3">
      <section class="flex h-[calc(100vh-24px)] max-h-[860px] w-full flex-col overflow-hidden rounded-2xl border border-stone-200 bg-white shadow-[0_16px_48px_rgba(28,25,23,.06)] dark:border-white/15 dark:bg-[#1c1c1e]">
        <header class="flex shrink-0 items-center border-b border-stone-100 px-5 py-4 dark:border-white/10 lg:px-6"><div class="flex items-center gap-3"><img src="/icons/icon-48.png" alt="Auto Proxy" class="size-10 rounded-xl" /><h1 class="text-2xl font-black tracking-[-.04em]">高级设置</h1></div></header>
        <div class="flex shrink-0 items-center justify-between border-b border-stone-100 px-5 dark:border-white/10 lg:px-6">
          <nav class="flex gap-1 py-3" role="tablist" aria-label="功能设置"><button class="tab" type="button" role="tab" aria-selected="true" data-tab-target="config">配置</button><button class="tab" type="button" role="tab" aria-selected="false" data-tab-target="tools">工具</button></nav>
          <button id="about-button" class="about-button rounded-xl px-4 py-2.5 text-sm font-extrabold text-stone-500 transition hover:bg-stone-50 hover:text-stone-900 dark:text-white/65 dark:hover:bg-white/8 dark:hover:text-white" type="button" aria-pressed="false">关于</button>
        </div>
        <div class="min-h-0 flex-1 overflow-y-auto px-5 py-4 lg:px-6">
          <section data-tab-panel="config" class="space-y-4">
            <div class="flex flex-wrap items-start justify-between gap-3"><span><span class="flex items-center gap-2.5"><h2 class="text-xl font-black tracking-[-.02em]">配置</h2><span id="config-runtime-badge" class="status-badge" data-status-tone="idle">未应用</span></span><p class="mt-1 text-sm text-stone-500 dark:text-white/65">优先同步远程 YAML，也可在下方手动编辑。</p></span></div>
            <form id="remote-config-form" class="rounded-xl border border-stone-200 bg-stone-50/70 p-4 dark:border-white/10 dark:bg-[#242426]">
              <label for="remote-config-url" class="text-sm font-extrabold">远程 YAML 订阅</label>
              <div class="mt-2 flex gap-2"><input id="remote-config-url" class="min-w-0 flex-1 rounded-lg border border-stone-300 bg-white px-3 py-2.5 text-sm outline-none focus:border-stone-500 dark:border-[#545458]/65 dark:bg-[#161618]" type="url" placeholder="https://example.com/config.yaml" required /><button id="sync-remote-config" class="shrink-0 rounded-lg bg-stone-900 px-5 py-2.5 text-xs font-extrabold text-white disabled:opacity-45 dark:bg-[#0a84ff]" type="submit">同步并应用</button></div>
              <p id="remote-config-hint" class="mt-2 text-xs text-stone-400 dark:text-white/40">订阅内容会同步到下方编辑器；再次同步可获取最新配置。</p>
            </form>
            <form id="config-test-form" class="grid gap-4 lg:grid-cols-[minmax(340px,.9fr)_minmax(520px,1.1fr)]">
              <section class="flex min-h-[590px] flex-col overflow-hidden rounded-xl border border-stone-200 bg-white dark:border-white/10 dark:bg-[#242426]">
                <header class="flex items-center justify-between gap-3 border-b border-stone-100 px-4 py-3 dark:border-white/8"><span><strong class="block text-sm">手动 YAML</strong><small class="text-xs text-stone-400 dark:text-white/40">高级编辑</small></span><button id="reset-config-sample" class="rounded-lg px-3 py-1.5 text-xs font-extrabold text-stone-400 hover:bg-stone-100 dark:hover:bg-white/8" type="button">恢复示例</button></header>
                <textarea id="config-test-input" class="min-h-0 flex-1 resize-none border-0 bg-stone-50/45 px-4 py-3 font-mono text-[12px] leading-5 text-stone-700 outline-none dark:bg-[#161618] dark:text-[#f5f5f7]" spellcheck="false" aria-label="YAML 配置"></textarea>
                <footer class="border-t border-stone-100 px-4 py-3 dark:border-white/8"><p id="config-sync-status" class="mb-2 min-h-5 text-xs text-stone-400 dark:text-white/40">等待配置</p><button class="w-full rounded-lg bg-stone-900 px-4 py-2.5 text-xs font-extrabold text-white disabled:opacity-45 dark:bg-[#0a84ff]" type="submit">保存并应用</button></footer>
              </section>
              <div class="space-y-3" aria-label="可视化配置编辑器">
                <section class="rounded-xl border border-stone-200 bg-stone-50/60 p-3.5 dark:border-white/10 dark:bg-[#242426]"><header class="flex items-center justify-between gap-3"><span><strong class="text-sm">节点</strong><small class="ml-2 text-xs text-stone-400 dark:text-white/40">HTTP</small></span><button id="add-visual-node" class="rounded-lg border border-stone-200 bg-white px-3 py-1.5 text-xs font-extrabold dark:border-white/15 dark:bg-[#2c2c2e]" type="button">添加节点</button></header><div id="visual-node-list" class="mt-3 grid gap-2"></div></section>
                <section class="rounded-xl border border-stone-200 bg-stone-50/60 p-3.5 dark:border-white/10 dark:bg-[#242426]"><header class="flex flex-wrap items-center justify-between gap-2"><span><strong class="text-sm">远程规则包</strong><small class="ml-2 text-xs text-stone-400 dark:text-white/40">yaml / list</small></span><span class="flex gap-2"><button id="refresh-config-providers" class="rounded-lg border border-stone-200 bg-white px-3 py-1.5 text-xs font-extrabold disabled:opacity-40 dark:border-white/15 dark:bg-[#2c2c2e]" type="button" disabled>更新缓存</button><button id="add-visual-provider" class="rounded-lg border border-stone-200 bg-white px-3 py-1.5 text-xs font-extrabold dark:border-white/15 dark:bg-[#2c2c2e]" type="button">添加规则包</button></span></header><div id="visual-provider-list" class="mt-3 grid gap-2"></div></section>
                <section class="rounded-xl border border-stone-200 bg-stone-50/60 p-3.5 dark:border-white/10 dark:bg-[#242426]"><header class="flex flex-wrap items-center justify-between gap-2"><span><strong class="text-sm">规则</strong><small class="ml-2 text-xs text-stone-400 dark:text-white/40">远程 + 本地，按顺序匹配</small></span><span class="flex gap-2"><button id="add-visual-ruleset" class="rounded-lg border border-stone-200 bg-white px-3 py-1.5 text-xs font-extrabold dark:border-white/15 dark:bg-[#2c2c2e]" type="button">引用规则包</button><button id="add-visual-local-rule" class="rounded-lg bg-stone-900 px-3 py-1.5 text-xs font-extrabold text-white dark:bg-[#0a84ff]" type="button">添加本地规则</button></span></header><div id="visual-rule-list" class="mt-3 grid gap-2"></div></section>
              </div>
            </form>
          </section>
          <section data-tab-panel="tools" class="space-y-4" hidden>
            <div><h2 class="text-xl font-black tracking-[-.02em]">工具</h2><p class="mt-1 text-sm text-stone-500 dark:text-white/65">验证规则，并查看指定代理节点的出口信息。</p></div>
            <form id="rule-match-form" class="rounded-xl border border-stone-200 bg-stone-50/70 p-4 dark:border-white/10 dark:bg-[#242426]"><strong class="text-sm">规则命中测试</strong><div class="mt-3 flex gap-2"><input id="rule-match-input" class="min-w-0 flex-1 rounded-lg border border-stone-300 bg-white px-3 py-2 text-sm outline-none dark:border-[#545458]/65 dark:bg-[#161618]" placeholder="example.com 或完整 URL" required /><button class="rounded-lg bg-stone-900 px-4 py-2 text-xs font-extrabold text-white dark:bg-[#0a84ff]" type="submit">测试</button></div><p id="rule-match-result" class="mt-3 rounded-lg bg-white px-3 py-2 text-xs font-semibold text-stone-600 dark:bg-white/[.06] dark:text-white/70" hidden></p></form>
            <section class="rounded-xl border border-stone-200 bg-stone-50/50 p-4 dark:border-white/10 dark:bg-[#242426]" aria-labelledby="network-info-title">
              <header class="flex flex-wrap items-center justify-between gap-3"><span class="flex items-center gap-2.5"><strong id="network-info-title" class="text-[16px]">节点出口</strong><small id="network-last-checked" class="status-badge" data-status-tone="idle">尚未检测</small></span><div class="flex gap-2"><select id="network-node-select" class="min-w-44 rounded-lg border border-stone-300 bg-white px-3 py-2 text-xs font-bold outline-none dark:border-[#545458]/65 dark:bg-[#161618]"></select><button id="refresh-network-info" class="rounded-lg bg-stone-900 px-4 py-2 text-xs font-extrabold text-white disabled:opacity-40 dark:bg-[#0a84ff]" type="button">检测出口</button></div></header>
              <article class="mt-3 rounded-xl border border-emerald-100 bg-emerald-50/50 p-4 dark:border-white/10 dark:bg-[#2c2c2e]"><strong id="network-node-name" class="text-emerald-700 dark:text-[#30d158]">未选择节点</strong><dl class="mt-3 grid gap-3 text-sm sm:grid-cols-3"><div><dt class="text-xs text-stone-400">出口 IP</dt><dd class="mt-1 flex items-center gap-2"><strong id="proxy-exit-ip">—</strong><button class="text-xs text-stone-400" type="button" data-copy-ip="proxy">复制</button></dd></div><div><dt class="text-xs text-stone-400">位置</dt><dd id="proxy-exit-location" class="mt-1">—</dd></div><div><dt class="text-xs text-stone-400">运营商 / 组织</dt><dd id="proxy-exit-network" class="mt-1">—</dd></div></dl></article>
            </section>
          </section>
          <section data-view-panel="about" class="space-y-6" hidden><div><h2 class="text-xl font-black">关于</h2><p class="mt-1 text-[15px] text-stone-500 dark:text-white/65">Auto Proxy 使用极简 Mihomo 风格 YAML 生成 PAC。</p></div><dl class="divide-y divide-stone-100 overflow-hidden rounded-2xl border border-stone-200 dark:divide-white/10 dark:border-white/10"><div class="flex justify-between px-5 py-4"><dt>扩展版本</dt><dd id="version">读取中</dd></div><div class="flex justify-between px-5 py-4"><dt>安装记录</dt><dd id="installed-at">读取中</dd></div></dl><details class="rounded-2xl border border-stone-200 dark:border-white/10"><summary class="cursor-pointer px-5 py-4 font-bold">诊断与故障排查</summary><div class="border-t border-stone-200 p-5 dark:border-white/10"><button id="clear-diagnostics" class="rounded-lg border px-3 py-2 text-xs" type="button">清除记录</button><div id="diagnostic-list" class="mt-4"></div></div></details></section>
        </div>
      </section>
    </main>
    <div id="toast-host" class="pointer-events-none fixed left-1/2 top-5 z-[1000] grid w-[min(420px,calc(100vw-32px))] -translate-x-1/2 gap-2" popover="manual" aria-live="polite"></div>
    <script type="module" src="/src/settings/settings.ts"></script>
  </body>
</html>
