<!doctype html>
<html lang="zh-CN">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><link rel="icon" href="/icons/icon-32.png" /><title>Auto Proxy 高级设置</title></head>
  <body class="settings-page min-h-screen bg-[#f5f5f7] font-sans text-sm leading-5 text-[#1d1d1f] antialiased dark:bg-black dark:text-[#f5f5f7] dark:[color-scheme:dark]">
    <main class="h-screen w-full">
      <section class="relative flex h-full w-full flex-col overflow-hidden">
        <div class="min-h-0 min-w-0 flex-1 overflow-y-auto"><div class="mx-auto w-full max-w-[1280px] px-6 pb-32 pt-7 lg:px-10 lg:pt-9">
          <header class="mb-9 flex items-center gap-3"><img src="/icons/icon-48.png" alt="Auto Proxy" class="size-9 rounded-[10px]" /><h1 class="text-[16px] font-semibold tracking-[-.025em]">Auto Proxy</h1></header>
          <section data-tab-panel="config" class="space-y-6">
            <div><span class="flex items-center gap-3"><h2 class="text-[30px] font-semibold tracking-[-.04em]">配置</h2><span id="config-runtime-badge" class="status-badge" data-status-tone="idle">未应用</span></span><p class="mt-1.5 text-sm text-stone-500 dark:text-white/50">管理订阅、节点和分流规则。</p></div>
            <form id="remote-config-form" class="apple-surface-raised flex flex-wrap items-center gap-2 rounded-[24px] p-2">
              <label for="remote-config-url" class="shrink-0 border-r border-black/[.055] px-3 pr-5 text-sm font-semibold dark:border-white/10">远程订阅</label>
              <input id="remote-config-url" class="min-w-[220px] flex-1 bg-transparent px-3 py-3 text-sm outline-none placeholder:text-stone-400 dark:placeholder:text-white/30" type="url" placeholder="https://example.com/config.yaml" required />
              <label class="flex shrink-0 items-center gap-2 rounded-full bg-black/[.04] p-1 pl-3 text-[11px] text-stone-400 dark:bg-white/8 dark:text-white/40" for="remote-config-interval">更新<select id="remote-config-interval" class="rounded-full border-0 bg-white px-3 py-2 text-xs font-medium text-stone-700 outline-none dark:bg-white/10 dark:text-white/75"></select></label>
              <button id="sync-remote-config" class="shrink-0 rounded-full bg-[#007aff] px-5 py-3 text-xs font-semibold text-white transition hover:bg-[#006ee6] active:scale-[.98] disabled:opacity-45 dark:bg-[#0a84ff]" type="submit">同步并应用</button>
            </form>
            <form id="config-test-form" class="grid items-stretch gap-5 xl:grid-cols-[minmax(360px,.72fr)_minmax(0,1.28fr)]">
              <section class="apple-surface flex h-full flex-col overflow-hidden rounded-2xl">
                <header class="flex items-center justify-between gap-3 border-b border-black/[.055] px-4 py-3.5 dark:border-white/10"><span><strong class="block text-sm font-semibold">YAML</strong><small class="text-xs text-stone-400 dark:text-white/35">手动编辑</small></span><button id="reset-config-sample" class="rounded-lg px-2.5 py-1.5 text-xs font-medium text-stone-400 transition hover:bg-black/[.035] hover:text-stone-600 dark:hover:bg-white/[.06] dark:hover:text-white/65" type="button">恢复示例</button></header>
                <textarea id="config-test-input" class="min-h-[520px] w-full flex-1 resize-none border-0 bg-[#fafafa] px-4 py-3 font-mono text-[12px] leading-5 text-stone-700 outline-none selection:bg-[#007aff]/20 dark:bg-[#101012] dark:text-[#d7dae0] xl:min-h-[600px]" spellcheck="false" aria-label="YAML 配置"></textarea>
                <footer class="border-t border-black/[.055] px-4 py-3 dark:border-white/10"><p id="config-sync-status" class="mb-2 text-xs text-red-600 dark:text-[#ff6961]" hidden></p><button class="w-full rounded-lg bg-[#007aff] px-4 py-2.5 text-xs font-semibold text-white transition hover:bg-[#006ee6] active:scale-[.99] disabled:opacity-45 dark:bg-[#0a84ff]" type="submit">保存并应用</button></footer>
              </section>
              <div class="space-y-5" aria-label="可视化配置编辑器">
                <section><header class="mb-3 flex items-center justify-between gap-3 px-1"><span class="flex items-center gap-2"><strong class="text-sm font-semibold">节点</strong><small id="visual-node-count" class="text-xs tabular-nums text-stone-400 dark:text-white/35">0</small></span><button id="add-visual-node" class="rounded-full bg-white/65 px-3 py-1.5 text-xs font-medium text-[#007aff] shadow-sm ring-1 ring-black/[.04] transition hover:bg-white dark:bg-white/8 dark:text-[#0a84ff] dark:ring-white/8" type="button">添加</button></header><div id="visual-node-list" class="grid gap-2"></div></section>
                <section><header class="mb-3 flex flex-wrap items-center justify-between gap-2 px-1"><span class="flex items-center gap-2"><strong class="text-sm font-semibold">规则</strong><small id="visual-rule-count" class="text-xs tabular-nums text-stone-400 dark:text-white/35">0</small><small class="text-xs text-stone-400 dark:text-white/35">MATCH 固定兜底</small></span><button id="add-visual-rule" class="rounded-full bg-white/65 px-3 py-1.5 text-xs font-medium text-[#007aff] shadow-sm ring-1 ring-black/[.04] transition hover:bg-white dark:bg-white/8 dark:text-[#0a84ff] dark:ring-white/8" type="button">添加</button></header><div id="visual-rule-list" class="grid gap-2"></div></section>
                <section><header class="mb-3 flex flex-wrap items-center justify-between gap-2 px-1"><span class="flex items-center gap-2"><strong class="text-sm font-semibold">远程规则包</strong><small id="visual-provider-count" class="text-xs tabular-nums text-stone-400 dark:text-white/35">0</small></span><span class="flex gap-1"><button id="refresh-config-providers" class="rounded-full px-3 py-1.5 text-xs font-medium text-stone-400 transition hover:bg-white/65 hover:text-stone-600 disabled:opacity-40 dark:text-white/40 dark:hover:bg-white/8 dark:hover:text-white/65" type="button" disabled>更新</button><button id="add-visual-provider" class="rounded-full bg-white/65 px-3 py-1.5 text-xs font-medium text-[#007aff] shadow-sm ring-1 ring-black/[.04] transition hover:bg-white dark:bg-white/8 dark:text-[#0a84ff] dark:ring-white/8" type="button">添加</button></span></header><div id="visual-provider-list" class="grid gap-2"></div></section>
              </div>
            </form>
          </section>
          <section data-tab-panel="tools" class="space-y-5" hidden>
            <div><h2 class="text-[30px] font-semibold tracking-[-.04em]">工具</h2><p class="mt-1.5 text-sm text-stone-500 dark:text-white/50">测试规则，并查看节点出口。</p></div>
            <form id="rule-match-form" class="apple-surface rounded-2xl p-5"><strong class="text-[15px] font-semibold">规则命中测试</strong><div class="mt-3 flex items-center rounded-xl border border-black/[.055] bg-[#f5f5f7] p-1 focus-within:border-transparent focus-within:ring-2 focus-within:ring-[#007aff]/20 dark:border-white/10 dark:bg-[#101012]"><input id="rule-match-input" class="min-w-0 flex-1 bg-transparent px-3 py-2.5 text-sm outline-none" placeholder="example.com 或完整 URL" required /><button class="rounded-lg bg-[#007aff] px-4 py-2.5 text-xs font-semibold text-white transition hover:bg-[#006ee6]" type="submit">测试</button></div><p id="rule-match-result" class="mt-3 rounded-xl bg-[#f5f5f7] px-3 py-2.5 text-xs font-medium text-stone-600 dark:bg-[#101012] dark:text-white/70" hidden></p></form>
            <section class="apple-surface rounded-2xl p-5" aria-labelledby="network-info-title">
              <header class="flex flex-wrap items-center justify-between gap-3"><span class="flex items-center gap-2.5"><strong id="network-info-title" class="text-[15px] font-semibold">节点出口</strong><small id="network-last-checked" class="status-badge" data-status-tone="idle">尚未检测</small></span><div class="flex gap-2"><select id="network-node-select" class="min-w-44 rounded-xl border-0 bg-[#f2f2f7] px-3 py-2 text-xs font-semibold outline-none dark:bg-black"></select><button id="refresh-network-info" class="rounded-xl bg-[#007aff] px-4 py-2 text-xs font-semibold text-white disabled:opacity-40 dark:bg-[#0a84ff]" type="button">检测出口</button></div></header>
              <article class="mt-4 rounded-xl bg-[#f5f5f7] p-4 dark:bg-[#101012]"><strong id="network-node-name" class="text-[#007aff] dark:text-[#0a84ff]">未选择节点</strong><dl class="mt-3 grid gap-3 text-sm sm:grid-cols-3"><div><dt class="text-xs text-stone-400">出口 IP</dt><dd class="mt-1 flex items-center gap-2"><strong id="proxy-exit-ip">—</strong><button class="text-xs text-[#007aff]" type="button" data-copy-ip="proxy">复制</button></dd></div><div><dt class="text-xs text-stone-400">位置</dt><dd id="proxy-exit-location" class="mt-1">—</dd></div><div><dt class="text-xs text-stone-400">运营商 / 组织</dt><dd id="proxy-exit-network" class="mt-1">—</dd></div></dl></article>
            </section>
          </section>
          <section data-view-panel="about" class="space-y-5" hidden><div><h2 class="text-[30px] font-semibold tracking-[-.04em]">关于</h2><p class="mt-1.5 text-sm text-stone-500 dark:text-white/50">Auto Proxy 使用 YAML 生成本地 PAC。</p></div><dl class="apple-surface divide-y divide-stone-100 overflow-hidden rounded-2xl dark:divide-white/10"><div class="flex justify-between px-5 py-4"><dt class="font-medium">扩展版本</dt><dd id="version" class="text-stone-400">读取中</dd></div><div class="flex justify-between px-5 py-4"><dt class="font-medium">安装记录</dt><dd id="installed-at" class="text-stone-400">读取中</dd></div></dl><details class="apple-surface overflow-hidden rounded-2xl"><summary class="cursor-pointer px-5 py-4 font-medium transition hover:bg-black/[.025] dark:hover:bg-white/[.035]">诊断与故障排查</summary><div class="border-t border-stone-100 p-5 dark:border-white/10"><button id="clear-diagnostics" class="rounded-lg px-3 py-2 text-xs font-semibold text-[#ff3b30] hover:bg-[#ff3b30]/8" type="button">清除记录</button><div id="diagnostic-list" class="mt-4"></div></div></details></section>
        </div></div>
        <nav class="fixed bottom-6 left-1/2 z-40 flex -translate-x-1/2 items-center gap-1 rounded-full border border-white/65 bg-white/58 p-1.5 shadow-[0_12px_36px_rgba(0,0,0,.12),inset_0_1px_0_rgba(255,255,255,.82)] backdrop-blur-2xl backdrop-saturate-150 dark:border-white/15 dark:bg-[#242426]/62 dark:shadow-[0_14px_42px_rgba(0,0,0,.48),inset_0_1px_0_rgba(255,255,255,.1)]" role="tablist" aria-label="高级设置页面"><button class="tab" type="button" role="tab" aria-selected="true" data-tab-target="config">配置</button><button class="tab" type="button" role="tab" aria-selected="false" data-tab-target="tools">工具</button><button id="about-button" class="about-button" type="button" role="tab" aria-selected="false">关于</button></nav>
      </section>
    </main>
    <div id="toast-host" class="pointer-events-none fixed left-1/2 top-5 z-[1000] grid w-[min(420px,calc(100vw-32px))] -translate-x-1/2 gap-2" popover="manual" aria-live="polite"></div>
    <dialog id="provider-content-dialog" class="m-auto max-h-[80vh] w-[min(860px,calc(100vw-32px))] rounded-[20px] border-0 bg-white p-0 text-stone-900 shadow-2xl ring-1 ring-black/10 backdrop:bg-black/35 dark:bg-[#1c1c1e] dark:text-[#f5f5f7] dark:ring-white/15"><header class="flex items-center justify-between border-b border-stone-100 px-5 py-4 dark:border-white/10"><span><strong id="provider-content-title" class="block text-base font-semibold">规则包内容</strong><small id="provider-content-meta" class="text-xs text-stone-400 dark:text-white/40"></small></span><button id="close-provider-content" class="rounded-lg px-3 py-2 text-sm font-semibold text-[#007aff] hover:bg-[#007aff]/8 dark:text-[#0a84ff]" type="button">关闭</button></header><pre id="provider-content-body" class="max-h-[58vh] overflow-auto whitespace-pre-wrap break-all bg-[#f7f7f9] p-5 font-mono text-xs leading-5 dark:bg-black"></pre></dialog>
    <script type="module" src="/src/settings/settings.ts"></script>
  </body>
</html>
