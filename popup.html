<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/icons/icon-32.png" />
    <title>Auto Proxy</title>
  </head>
  <body class="m-0 bg-white font-sans text-stone-900 antialiased dark:bg-black dark:text-[#f5f5f7] dark:[color-scheme:dark]">
    <main class="relative w-[400px] overflow-hidden bg-[#f3f3f1] dark:bg-[#19191b]">
      <header class="flex h-[88px] items-center gap-3 px-6">
        <img id="popup-icon" src="/icons/icon-48.png" alt="" class="size-10 shrink-0 rounded-xl" aria-hidden="true" />

        <div class="min-w-0 flex-1">
          <h1 class="truncate text-[17px] font-semibold tracking-[-.025em]">Auto Proxy</h1>
          <p class="mt-0.5 text-[9px] font-semibold tracking-[.18em] text-stone-400 dark:text-white/30">SMART ROUTING</p>
        </div>

        <nav class="flex shrink-0 items-center gap-2" aria-label="快捷操作">
          <div class="group/edit relative size-9 rounded-full">
            <button id="popup-subscription-edit" class="absolute inset-0 z-10 size-full cursor-pointer rounded-full border-0 bg-transparent p-0 text-[0] text-transparent outline-none focus-visible:ring-2 focus-visible:ring-[#168cf1]/40 disabled:cursor-not-allowed disabled:opacity-45" type="button" aria-label="修改订阅"></button>
            <span class="pointer-events-none grid size-9 place-items-center rounded-full bg-black/[.04] text-stone-500 ring-1 ring-black/[.025] transition duration-200 group-hover/edit:bg-black/[.075] group-hover/edit:text-stone-800 dark:bg-white/[.06] dark:text-white/45 dark:ring-white/[.035] dark:group-hover/edit:bg-white/[.1] dark:group-hover/edit:text-white/80" aria-hidden="true">
              <svg class="size-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="m4 16-.75 4.25L7.5 19l11-11-3-3Z" />
                <path d="m14 6 3 3" />
              </svg>
            </span>
          </div>

          <button id="open-settings" class="grid size-9 place-items-center rounded-full border-0 bg-black/[.04] p-0 text-stone-500 ring-1 ring-black/[.025] transition duration-200 hover:bg-black/[.075] hover:text-stone-800 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-black/20 active:scale-95 dark:bg-white/[.06] dark:text-white/45 dark:ring-white/[.035] dark:hover:bg-white/[.1] dark:hover:text-white/80" type="button" aria-label="高级设置" title="高级设置">
            <svg class="size-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z" />
              <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 8.5 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.1-.4H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 8.5a1.7 1.7 0 0 0-.34-1.88l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-.6 1.7 1.7 0 0 0 .4-1.1V3a2 2 0 1 1 4 0v.09A1.7 1.7 0 0 0 15.5 4.6a1.7 1.7 0 0 0 1.88-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9c.12.37.34.72.6 1 .3.29.68.46 1.1.49H21a2 2 0 1 1 0 4h-.09A1.7 1.7 0 0 0 19.4 15Z" />
            </svg>
          </button>
        </nav>
        <span id="popup-subscription-summary" hidden>尚未设置</span>
      </header>

      <section class="flex flex-col items-center px-6 pb-10 pt-5" aria-label="代理控制">
        <button id="proxy-toggle" class="group relative h-[70px] w-[272px] shrink-0 overflow-hidden rounded-full bg-[#202020] p-1 shadow-[0_10px_30px_rgba(0,0,0,.10)] ring-1 ring-black/10 transition-[background-color,box-shadow,transform] duration-500 ease-out [&.active]:bg-[#19b957] [&.active]:shadow-[0_12px_34px_rgba(25,185,87,.18)] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-black/30 active:scale-[.985] disabled:cursor-not-allowed disabled:opacity-45 dark:bg-[#080808] dark:ring-white/10 dark:[&.active]:bg-[#18ad52]" type="button" role="switch" aria-checked="false" aria-label="开启或关闭 Auto Proxy" title="正在读取配置" disabled>
          <span class="absolute left-1 top-1 h-[62px] w-[132px] rounded-full bg-[#f5f5f3] shadow-[0_2px_10px_rgba(0,0,0,.16)] transition-transform duration-500 ease-[cubic-bezier(.22,1,.36,1)] group-[.active]:translate-x-[132px] dark:bg-[#efefed]" aria-hidden="true"></span>
          <span class="pointer-events-none absolute inset-y-0 left-0 z-10 flex w-1/2 items-center justify-center gap-1 text-[18px] font-medium tracking-[-.025em] text-stone-900 transition-colors duration-300 group-[.active]:text-white/75" aria-hidden="true">
            Direct<sup class="self-start pt-[19px] text-[8px] font-semibold tracking-normal opacity-55">01</sup>
          </span>
          <span class="pointer-events-none absolute inset-y-0 right-0 z-10 flex w-1/2 items-center justify-center gap-1 text-[18px] font-medium tracking-[-.025em] text-white/70 transition-colors duration-300 group-[.active]:text-stone-900" aria-hidden="true">
            Proxy<sup class="self-start pt-[19px] text-[8px] font-semibold tracking-normal opacity-55">02</sup>
          </span>
          <span id="toggle-label" hidden>OFF</span>
        </button>

        <div class="mt-8 grid w-full grid-cols-[minmax(0,1fr)_1px_minmax(0,1fr)] items-stretch gap-5" aria-label="当前网站代理状态">
          <div class="min-w-0">
            <span class="block text-[9px] font-semibold tracking-[.16em] text-stone-400 dark:text-white/30">CURRENT SITE</span>
            <span id="site-host" class="mt-1.5 block truncate text-[15px] font-medium leading-5 tracking-[-.015em]" title="当前网站">正在读取…</span>
          </div>

          <span class="w-px bg-black/[.075] dark:bg-white/10" aria-hidden="true"></span>

          <div class="min-w-0 text-right">
            <span class="block text-[9px] font-semibold tracking-[.16em] text-stone-400 dark:text-white/30">EXIT NODE</span>
            <span id="site-status" class="mt-1.5 block truncate text-[15px] font-medium leading-5 text-stone-600 data-[status-tone=error]:text-red-500 data-[status-tone=fresh]:text-[#13a84d] data-[status-tone=stale]:text-amber-500 dark:text-white/65 dark:data-[status-tone=error]:text-[#ff6961] dark:data-[status-tone=fresh]:text-[#30d158] dark:data-[status-tone=stale]:text-[#ff9f0a]" data-status-tone="idle" title="出口节点">等待</span>
          </div>
        </div>
      </section>

      <p id="popup-subscription-hint" class="pointer-events-none absolute bottom-2 left-1/2 z-20 m-0 max-w-[220px] -translate-x-1/2 truncate whitespace-nowrap rounded-full bg-black/[.055] px-3.5 py-2 text-center text-xs font-medium text-stone-500 ring-1 ring-black/[.03] dark:bg-white/[.08] dark:text-white/55 dark:ring-white/[.04]" role="status" aria-live="polite" hidden></p>

      <form id="popup-subscription-form" class="absolute inset-x-5 top-[74px] z-30 flex h-10 items-center gap-1 rounded-full bg-[#e5e5e7] p-1 shadow-[0_8px_24px_rgba(0,0,0,.08)] ring-1 ring-black/[.04] dark:bg-[#303033] dark:ring-white/[.05]" hidden>
        <label class="sr-only" for="popup-subscription-url">远程订阅地址</label>
        <input id="popup-subscription-url" class="h-8 min-w-0 flex-1 rounded-full border-0 bg-white/80 px-3.5 text-xs outline-none ring-[#168cf1]/20 transition placeholder:text-stone-400 focus:ring-2 dark:bg-white/[.08] dark:placeholder:text-white/30" type="url" placeholder="粘贴 YAML 订阅地址" required />
        <button id="popup-subscription-cancel" class="h-8 shrink-0 rounded-full px-3 text-xs font-medium text-stone-500 transition hover:bg-black/[.05] dark:text-white/45 dark:hover:bg-white/[.07]" type="button">取消</button>
        <button id="popup-subscription-submit" class="h-8 shrink-0 rounded-full bg-[#168cf1] px-3.5 text-xs font-medium text-white transition hover:bg-[#087ee0] disabled:opacity-45" type="submit">应用</button>
      </form>
    </main>
    <script type="module" src="/src/popup/popup.ts"></script>
  </body>
</html>
