<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auto Proxy</title>
  </head>
  <body class="bg-stone-100 font-sans text-stone-900 antialiased">
    <main class="w-[300px] p-4">
      <section class="overflow-hidden rounded-[22px] border border-stone-200 bg-white shadow-[0_18px_50px_rgba(28,25,23,.08)]">
        <header class="flex items-center gap-3 border-b border-stone-100 px-5 py-4">
          <span class="grid size-9 place-items-center rounded-xl bg-stone-900 text-sm font-black text-white" aria-hidden="true">A</span>
          <strong class="text-[16px] font-black tracking-[-.02em]">Auto Proxy</strong>
        </header>
        <div class="flex items-center justify-between gap-5 px-5 py-5">
          <span class="text-[15px] font-bold">代理分流</span>
          <button id="proxy-toggle" class="group flex items-center gap-2.5 disabled:cursor-wait disabled:opacity-50" type="button" role="switch" aria-checked="false" aria-label="开启或关闭 Auto Proxy">
            <span class="relative h-8 w-14 rounded-full bg-stone-200 transition-colors duration-200 group-[.active]:bg-emerald-500" aria-hidden="true">
              <span class="absolute left-1 top-1 size-6 rounded-full bg-white shadow-sm transition-transform duration-200 group-[.active]:translate-x-6"></span>
            </span>
            <strong id="toggle-label" class="w-7 text-left text-xs font-black tracking-[.08em] text-stone-400 group-[.active]:text-emerald-700">OFF</strong>
          </button>
        </div>
        <button id="open-settings" class="w-full border-t border-stone-100 px-5 py-3.5 text-center text-sm font-bold text-stone-500 transition hover:bg-stone-50 hover:text-stone-900" type="button">高级设置</button>
      </section>
    </main>
    <script type="module" src="/src/popup/popup.ts"></script>
  </body>
</html>
