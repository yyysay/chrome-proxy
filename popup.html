<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auto Proxy</title>
  </head>
  <body class="bg-white font-sans text-stone-900 antialiased dark:bg-[#1c1c1e] dark:text-[#f5f5f7] dark:[color-scheme:dark]">
    <main class="w-[300px]">
      <section class="overflow-hidden">
        <header class="flex items-center gap-3 border-b border-stone-100 px-5 py-4 dark:border-white/10">
          <img src="/icons/icon-48.png" alt="Auto Proxy" class="size-9 rounded-xl" />
          <strong class="flex items-center gap-2 text-[16px] font-black tracking-[-.02em] dark:text-[#f5f5f7]">Auto Proxy<span id="popup-health-dot" class="size-2 rounded-full bg-stone-300 shadow-[0_0_0_3px_rgba(168,162,158,.12)] dark:bg-white/25" title="代理状态读取中" aria-label="代理状态读取中"></span></strong>
        </header>
        <div class="flex items-center justify-between gap-5 px-5 py-5">
          <span class="text-[15px] font-bold dark:text-white/90">代理分流</span>
          <button id="proxy-toggle" class="group flex items-center gap-2.5 disabled:cursor-wait disabled:opacity-50" type="button" role="switch" aria-checked="false" aria-label="开启或关闭 Auto Proxy">
            <span class="relative h-8 w-14 rounded-full bg-stone-200 transition-colors duration-200 group-[.active]:bg-emerald-500 dark:bg-white/15 dark:group-[.active]:bg-[#30d158]" aria-hidden="true">
              <span class="absolute left-1 top-1 size-6 rounded-full bg-white shadow-sm transition-transform duration-200 group-[.active]:translate-x-6 dark:shadow-black/35"></span>
            </span>
            <strong id="toggle-label" class="w-7 text-left text-xs font-black tracking-[.08em] text-stone-400 group-[.active]:text-emerald-700 dark:text-white/35 dark:group-[.active]:text-[#30d158]">OFF</strong>
          </button>
        </div>
        <button id="open-settings" class="w-full border-t border-stone-100 px-5 py-3.5 text-center text-sm font-bold text-stone-500 transition-colors hover:bg-stone-50 hover:text-stone-900 dark:border-white/10 dark:text-white/55 dark:hover:bg-white/[.06] dark:hover:text-white" type="button">高级设置</button>
      </section>
    </main>
    <script type="module" src="/src/popup/popup.ts"></script>
  </body>
</html>
