<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rule Proxy Lab</title>
  </head>
  <body>
    <main class="panel">
      <header class="header">
        <span class="logo" aria-hidden="true">R</span>
        <strong>规则分流</strong>
        <button id="open-settings" class="icon-button" type="button" title="打开设置">设置</button>
      </header>

      <section class="state-card">
        <div id="status-dot" class="status-dot" aria-hidden="true"></div>
        <div>
          <h1 id="state-title">正在读取…</h1>
          <p id="status">请稍候</p>
        </div>
      </section>

      <button id="proxy-toggle" class="primary-button" type="button">开启分流</button>

      <dl class="summary">
        <div><dt>代理地址</dt><dd id="proxy-endpoint">未配置</dd></div>
        <div><dt>未命中规则</dt><dd id="fallback-label">本地直连</dd></div>
        <div><dt>已加载规则</dt><dd id="rule-count">0 条</dd></div>
      </dl>

      <button id="check-proxy" class="secondary-button" type="button">检查代理连接</button>
      <p id="proxy-status" class="feedback" role="status"></p>
    </main>
    <script type="module" src="/src/popup/popup.ts"></script>
  </body>
</html>
