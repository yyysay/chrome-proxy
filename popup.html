<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auto Proxy</title>
  </head>
  <body>
    <main class="panel">
      <header class="popup-header">
        <span class="brand-mark" aria-hidden="true">A</span>
        <strong>Auto Proxy</strong>
      </header>

      <section class="switch-card" aria-label="Auto Proxy 开关">
        <span class="switch-title">代理分流</span>
        <button id="proxy-toggle" class="proxy-switch" type="button" role="switch" aria-checked="false" aria-label="开启或关闭 Auto Proxy">
          <span class="proxy-switch-track" aria-hidden="true"><span></span></span>
          <strong id="toggle-label">OFF</strong>
        </button>
      </section>

      <button id="open-settings" class="settings-link" type="button">高级设置</button>
    </main>
    <script type="module" src="/src/popup/popup.ts"></script>
  </body>
</html>
