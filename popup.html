<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/icons/icon-32.png" />
    <title>Auto Proxy</title>
  </head>
  <body class="bg-[#f5f5f7] font-sans text-stone-900 antialiased dark:bg-black dark:text-[#f5f5f7] dark:[color-scheme:dark]">
    <main class="w-[356px] p-3">
      <header class="flex items-center gap-3 px-2 py-2.5">
        <img id="popup-icon" src="/icons/icon-48.png" alt="Auto Proxy" class="size-9 rounded-xl" />
        <strong class="min-w-0 flex-1 text-[16px] font-semibold tracking-[-.02em]">Auto Proxy</strong>
        <button id="open-settings" class="shrink-0 rounded-full bg-white/70 px-3 py-1.5 text-xs font-medium text-stone-400 shadow-sm ring-1 ring-black/[.04] transition hover:bg-white hover:text-stone-700 dark:bg-white/8 dark:text-white/40 dark:ring-white/8 dark:hover:bg-white/12 dark:hover:text-white" type="button">设置</button>
      </header>
      <section class="rounded-[22px] border border-black/[.07] bg-white p-4 shadow-[0_2px_8px_rgba(0,0,0,.045)] dark:border-white/10 dark:bg-[#1c1c1e]">
        <div class="flex items-center justify-between gap-5">
          <strong class="text-sm">代理引擎</strong>
          <button id="proxy-toggle" class="group flex items-center gap-2.5 disabled:cursor-not-allowed disabled:opacity-40" type="button" role="switch" aria-checked="false" aria-label="开启或关闭 Auto Proxy" title="正在读取配置" disabled>
            <span class="relative h-8 w-14 rounded-full bg-stone-200 transition-colors duration-200 group-[.active]:bg-emerald-500 dark:bg-white/15 dark:group-[.active]:bg-[#30d158]" aria-hidden="true"><span class="absolute left-1 top-1 size-6 rounded-full bg-white shadow-sm transition-transform duration-200 group-[.active]:translate-x-6 dark:shadow-black/35"></span></span>
            <strong id="toggle-label" class="w-7 text-left text-xs font-semibold tracking-[.08em] text-stone-400 group-[.active]:text-emerald-700 dark:text-white/35 dark:group-[.active]:text-[#30d158]">OFF</strong>
          </button>
        </div>
        <div class="mt-4 flex items-center justify-between rounded-full bg-black/[.035] px-4 py-3 dark:bg-white/[.06]">
          <strong id="site-host" class="block max-w-[210px] truncate text-sm">正在读取…</strong>
          <span id="site-status" class="status-badge max-w-[120px] overflow-hidden text-ellipsis" data-status-tone="idle">等待</span>
        </div>
      </section>
      <section class="mt-2 overflow-hidden rounded-[22px] border border-black/[.07] bg-white px-4 py-3 shadow-[0_2px_8px_rgba(0,0,0,.045)] dark:border-white/10 dark:bg-[#1c1c1e]">
        <div class="flex min-w-0 items-center gap-2">
          <strong class="shrink-0 text-xs text-stone-500 dark:text-white/55">远程订阅</strong>
          <small id="popup-subscription-summary" class="min-w-0 flex-1 truncate text-xs text-stone-400 dark:text-white/35">尚未设置</small>
          <button id="popup-subscription-edit" class="shrink-0 rounded-full px-3 py-2 text-xs font-medium text-[#007aff] transition hover:bg-[#007aff]/8 dark:text-[#0a84ff]" type="button">添加</button>
        </div>
        <form id="popup-subscription-form" class="mt-3 border-t border-black/[.055] pt-3 dark:border-white/10" hidden>
          <input id="popup-subscription-url" class="w-full rounded-full border-0 bg-black/[.04] px-4 py-3 text-xs outline-none ring-[#007aff]/25 transition placeholder:text-stone-400 focus:ring-2 dark:bg-white/[.07] dark:placeholder:text-white/30" type="url" placeholder="粘贴 YAML 订阅地址" required />
          <div class="mt-2 flex justify-end gap-1">
            <button id="popup-subscription-cancel" class="rounded-full px-3 py-2 text-xs font-medium text-stone-400 hover:bg-black/[.035] dark:hover:bg-white/[.07]" type="button">取消</button>
            <button id="popup-subscription-submit" class="rounded-full bg-[#007aff] px-4 py-2 text-xs font-medium text-white transition hover:bg-[#006ee6] disabled:opacity-45 dark:bg-[#0a84ff]" type="submit">应用</button>
          </div>
        </form>
        <p id="popup-subscription-hint" class="mt-2 px-1 text-xs text-stone-400 dark:text-white/40" hidden></p>
      </section>
    </main>
    <script type="module" src="/src/popup/popup.ts"></script>
  </body>
</html>
